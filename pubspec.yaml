name: wasteglass
description: "Waste Glass Collection App for recycling route management."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # HTTP requests to backend
  http: ^1.2.1

  # Barcode scanning
  mobile_scanner: ^5.2.3

  # Local SQLite database (offline-first)
  sqflite: ^2.3.0
  path: ^1.9.0

  # State management
  provider: ^6.1.2

  # Utility
  intl: ^0.19.0
  connectivity_plus: ^5.0.2
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
